name: Ghost lightweight validation

on:
  push:
    branches:
      - 2.7.26-darkmesh-ghost
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghost-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-regressions:
    name: Ghost source regression guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run targeted regression checks
        run: python3 -m unittest discover -s tests/ghost -p 'test_*.py' -v

  cpp-static-analysis:
    name: Shared C++ static analysis (no firmware builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update -qq && sudo apt-get install -y cppcheck
      - name: Analyze Ghost changes
        run: |
          cppcheck --enable=warning,performance,portability --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem --suppress=missingInclude --suppress=unknownMacro --language=c++ --std=c++17 src/modules/RoutingModule.cpp src/mesh/MeshService.cpp
