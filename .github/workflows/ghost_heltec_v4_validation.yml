name: Ghost cross-platform validation

on:
  push:
    branches:
      - 2.7.26-darkmesh-ghost
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghost-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-regressions:
    name: Ghost source regression guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run targeted regression checks
        run: python3 -m unittest discover -s tests/ghost -p 'test_*.py' -v

  discover:
    name: Discover supported firmware boards
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.matrix.outputs.boards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python3 -m pip install platformio
      - id: matrix
        name: Read all release-level boards across architectures
        shell: bash
        run: |
          echo "boards=$(python3 bin/generate_ci_matrix.py all)" >> "$GITHUB_OUTPUT"

  firmware-build:
    name: Build ${{ matrix.board.board }} (${{ matrix.board.platform }})
    needs: [source-regressions, discover]
    if: ${{ needs.discover.outputs.boards != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        board: ${{ fromJson(needs.discover.outputs.boards) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python3 -m pip install platformio
      - name: Compile firmware (no flashing or release)
        run: pio run -e "${{ matrix.board.board }}"
      - name: Verify and enumerate generated firmware images
        shell: bash
        run: |
          find ".pio/build/${{ matrix.board.board }}" -maxdepth 1 -type f \\( -name 'firmware*.bin' -o -name 'firmware*.uf2' -o -name 'firmware*.hex' -o -name 'firmware*.zip' \\) -print
          test -n "$(find ".pio/build/${{ matrix.board.board }}" -maxdepth 1 -type f \\( -name 'firmware*.bin' -o -name 'firmware*.uf2' -o -name 'firmware*.hex' -o -name 'firmware*.zip' \\) -print -quit)"
      - name: Save firmware for hardware testing
        uses: actions/upload-artifact@v4
        with:
          name: ghost-${{ matrix.board.board }}-${{ github.sha }}
          path: |
            .pio/build/${{ matrix.board.board }}/firmware*.bin
            .pio/build/${{ matrix.board.board }}/firmware*.uf2
            .pio/build/${{ matrix.board.board }}/firmware*.hex
            .pio/build/${{ matrix.board.board }}/firmware*.zip
          if-no-files-found: error
          retention-days: 7
