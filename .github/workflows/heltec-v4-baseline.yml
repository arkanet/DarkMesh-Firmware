name: DarkMesh 2.7.26 Heltec V4 baseline
on:
  push:
    branches:
      - 'TFT-SPI-480x320'
    paths:
      - '.github/workflows/heltec-v4-baseline.yml'
      - 'src/**'
      - 'lib/**'
      - 'variants/**'
      - 'bin/test-heltec-v4-r2.py'
      - 'bin/test-heltec-pmtiles.py'
      - 'test/heltec_pmtiles/**'
      - 'extra_scripts/heltec_v4_r2_storage.py'
      - 'platformio.ini'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: darkmesh-heltec-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    name: ${{ matrix.pio_env }} (compile-only)
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pio_env:
          - heltec-v4-r2-ili9488-p04
          - heltec-v4-r2-ili9488-p03
          - heltec-v4-r2-ili9488-p02
          - heltec-v4-tft
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Prepare isolated PlatformIO and Python environment
        shell: bash
        run: |
          set -euo pipefail
          # Cache tools per repository, away from other self-hosted runners.
          # This directory survives checkout and subsequent workflow runs.
          core_dir="$(dirname "$GITHUB_WORKSPACE")/.platformio-core-darkmesh"
          mkdir -p "$core_dir"
          echo "PLATFORMIO_CORE_DIR=$core_dir" >> "$GITHUB_ENV"
          # Use the public Python index for the ESP32 tool's cryptography wheel.
          echo "PIP_INDEX_URL=https://pypi.org/simple" >> "$GITHUB_ENV"
          echo "PIP_DEFAULT_TIMEOUT=90" >> "$GITHUB_ENV"
          echo "PIP_RETRIES=5" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/pio-venv"
          "$RUNNER_TEMP/pio-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/pio-venv/bin/python" -m pip install 'platformio>=6.2.0,<7' 'scons>=4.8,<5'
          echo "$RUNNER_TEMP/pio-venv/bin" >> "$GITHUB_PATH"
      - name: Check cryptography wheel availability
        shell: bash
        run: |
          set -euo pipefail
          python -m pip download --only-binary=:all: --no-deps \
            --dest "$RUNNER_TEMP/esp-python-check" 'cryptography~=46.0.0'
      - name: Test production P04 storage and GPIO contracts
        if: matrix.pio_env == 'heltec-v4-r2-ili9488-p04'
        run: python3 bin/test-heltec-v4-r2.py
      - name: Test PMTiles archives and production SdFat bridge
        if: matrix.pio_env == 'heltec-v4-r2-ili9488-p04'
        run: python3 bin/test-heltec-pmtiles.py
      - name: Compile ${{ matrix.pio_env }} (NO FLASH)
        env:
          PIO_ENV: ${{ matrix.pio_env }}
        shell: bash
        run: |
          set -o pipefail
          pio run -j 2 -e "$PIO_ENV" 2>&1 | tee firmware-build.log
      - name: Save logs
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pio_env }}-build-log
          path: firmware-build.log
          if-no-files-found: warn
      - name: Save firmware for review (DO NOT FLASH)
        if: success()
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pio_env }}-compile-only-firmware
          path: .pio/build/${{ matrix.pio_env }}/*.bin
          compression-level: 0
          if-no-files-found: warn
